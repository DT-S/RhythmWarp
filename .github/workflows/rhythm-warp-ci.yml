name: Rhythm Warp student edition checks

on:
  push:
    branches:
      - feat/student-edition
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  node-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run rhythm engine and branding tests
        run: npm test
